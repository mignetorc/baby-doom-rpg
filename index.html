<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Baby Doom RPG — Mundo 1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07140d;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
#game{position:fixed;inset:0;overflow:hidden;background:#234d2d}
canvas{position:absolute;inset:0;width:100%;height:100%}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:20;box-shadow:inset 0 0 100px #0008}
#hud{position:fixed;z-index:30;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.card{background:linear-gradient(#101b18ee,#08110fee);border:2px solid #7c8e6c;border-radius:14px;color:#fff;padding:7px 10px;box-shadow:0 5px 18px #0008;text-shadow:0 2px 3px #000}
.playerCard{min-width:190px}.mission{min-width:150px}
.name{font-size:14px;font-weight:950;color:#ffd34d}.small{font-size:10px;color:#d7e2d5}
.bar{height:8px;background:#17201e;border:1px solid #000;border-radius:8px;overflow:hidden;margin:3px 0}
.bar i{display:block;height:100%;transition:width .15s}.hp{background:#e54b4b}.mp{background:#4a91e8}.xp{background:#e7c94c}
#target{position:fixed;z-index:31;left:50%;top:92px;transform:translateX(-50%);width:180px;background:#101914dd;border:2px solid #65775e;border-radius:10px;padding:5px;color:#fff;text-align:center;opacity:0;transition:.15s;pointer-events:none}
#target b{font-size:11px}.targetbar{height:6px;background:#222;border-radius:6px;overflow:hidden}.targetbar i{display:block;height:100%;background:#e14d4d}
#quest{position:fixed;z-index:31;left:9px;top:112px;width:190px;background:#101914df;border:1px solid #a58c46;border-radius:12px;padding:8px;color:#fff;box-shadow:0 4px 15px #0006}
#quest strong{color:#ffd34d;font-size:12px}.questline{font-size:11px;margin-top:3px}
#toast{position:fixed;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%);background:#0a100ddd;border:2px solid #e6cf7a;border-radius:12px;padding:9px 15px;color:#fff;font-weight:900;display:none;pointer-events:none}
#controls{position:fixed;z-index:40;left:12px;right:12px;bottom:max(9px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end}
#joy{width:104px;height:104px;border-radius:50%;border:2px solid #ffffff66;background:#07101999;box-shadow:inset 0 0 15px #0008;position:relative}
#knob{position:absolute;left:28px;top:28px;width:44px;height:44px;border-radius:50%;background:linear-gradient(#fff9,#aaa8);border:2px solid #fff8;box-shadow:0 4px 10px #0008}
.actions{display:flex;gap:6px;align-items:end}.btn{width:54px;height:54px;border-radius:50%;border:2px solid #fff8;background:radial-gradient(circle at 35% 30%,#4e72d7,#1a2e70);color:#fff;font-size:22px;box-shadow:0 5px 12px #0009}.btn:active{transform:scale(.9)}.attack{width:74px;height:74px;background:radial-gradient(circle at 35% 30%,#e59a46,#7e2b20)}
#inventory{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:max(7px,env(safe-area-inset-bottom));display:flex;gap:4px;background:#0a1110dd;border:1px solid #ffffff55;border-radius:10px;padding:4px;pointer-events:none}
.slot{width:34px;height:34px;border:1px solid #aaa8;background:#24312c;border-radius:6px;display:grid;place-items:center;font-size:17px}
#mini{position:fixed;z-index:32;right:10px;top:112px;width:128px;height:94px;border:2px solid #8d9a76;border-radius:12px;background:#152619cc;box-shadow:0 4px 15px #0008;overflow:hidden}
#mini canvas{position:absolute;width:100%;height:100%}
#auto{position:fixed;z-index:32;left:126px;bottom:112px;width:48px;height:48px;border-radius:50%;background:#121b18dd;border:2px solid #d2b95e;color:#fff;font-size:10px;font-weight:900}
@media(min-width:800px){#quest{top:125px;width:220px}.btn{width:60px;height:60px}.attack{width:82px;height:82px}#joy{width:116px;height:116px}#knob{left:31px;top:31px}}
</style>
</head>
<body>
<div id="game"><canvas id="world"></canvas><canvas id="fx"></canvas></div>
<div id="vignette"></div>

<div id="hud">
  <div class="card playerCard">
    <div><span class="name">👶 Baby Doom</span> <span class="small">· Guerrero · Nv. <b id="lvl">1</b></span></div>
    ❤️ <div class="bar"><i id="hp" class="hp" style="width:100%"></i></div>
    🔵 <div class="bar"><i id="mp" class="mp" style="width:100%"></i></div>
    ⭐ <div class="bar"><i id="xp" class="xp" style="width:8%"></i></div>
    <span class="small">⚔️ <b id="atk">35</b> · 🛡️ <b id="def">5</b> · 💰 <b id="gold">0</b></span>
  </div>
  <div class="card mission">🌲 <b>Mundo 1</b><br><span class="small">Lobos derrotados</span> <b id="kills">0/8</b><br><span class="small">💰 Recompensas + XP</span></div>
</div>

<div id="target"><b id="targetName">Lobo Salvaje · Nv. 3</b><div class="targetbar"><i id="targetHp" style="width:100%"></i></div></div>
<div id="quest"><strong>📜 MISIÓN ACTIVA</strong><div class="questline">Control de Lobos</div><div class="questline">Derrota 8 Lobos Salvajes</div><div class="questline">Progreso: <b id="qkills">0/8</b></div></div>
<div id="mini"><canvas id="minimap"></canvas></div>
<div id="toast"></div>

<div id="controls">
  <div id="joy"><div id="knob"></div></div>
  <div class="actions">
    <button class="btn" id="fire">🔥</button>
    <button class="btn" id="ice">❄️</button>
    <button class="btn" id="magic">✨</button>
    <button class="btn attack" id="attack">⚔️</button>
  </div>
</div>
<button id="auto">AUTO</button>

<div id="inventory">
  <div class="slot">🗡️</div><div class="slot">🛡️</div><div class="slot" id="potion">🧪</div><div class="slot">💎</div><div class="slot">🔒</div><div class="slot">🔒</div>
</div>

<script>
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');
const fx=document.getElementById('fx'),fctx=fx.getContext('2d');
const mini=document.getElementById('minimap'),mctx=mini.getContext('2d');

const WORLD={w:2600,h:1800};
const player={x:920,y:870,dx:0,dy:0,speed:230,maxHp:100,hp:100,maxMp:100,mp:100,xp:8,lvl:1,gold:0,attack:35,defense:5,attackCd:0,auto:false};
const mobs=[],drops=[],particles=[],texts=[];
let kills=0,last=performance.now(),shake=0,flash=0,toastTimer=0;

const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '||e.key.toLowerCase()==='j')attack()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;fx.width=canvas.width;fx.height=canvas.height;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);fctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',resize);resize();

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function addMob(x,y){mobs.push({x,y,hp:100,maxHp:100,dead:false,aggro:false,attackTimer:0,phase:Math.random()*6.28})}
[[620,670],[700,760],[790,650],[880,730],[1010,680],[1110,760],[1220,690],[1320,820],[760,930],[980,970],[1160,940],[1380,980]].forEach(p=>addMob(...p));
[[580,600,'common'],[680,850,'rare'],[850,600,'common'],[1120,620,'epic'],[1320,900,'legend']].forEach(p=>drops.push({x:p[0],y:p[1],type:p[2],phase:Math.random()*6}));

function camera(){return{x:clamp(player.x-innerWidth/2,0,WORLD.w-innerWidth),y:clamp(player.y-innerHeight/2,0,WORLD.h-innerHeight)}}
function sx(x,c){return x-c.x} function sy(y,c){return y-c.y}

function roundedRect(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r);c.fill()}
function circle(c,x,y,r){c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill()}
function poly(c,pts){c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.closePath();c.fill()}

function drawGround(c){
  c.fillStyle='#2f713d';c.fillRect(0,0,innerWidth,innerHeight);
  const cam=camera();
  c.save();c.translate(-cam.x,-cam.y);
  c.fillStyle='#3b7d43';c.fillRect(0,0,WORLD.w,WORLD.h);

  // soft terrain patches
  for(let i=0;i<90;i++){
    let x=(i*313)%WORLD.w,y=(i*181)%WORLD.h,r=70+(i%5)*18;
    c.fillStyle=i%2?'#397742':'#447f47';circle(c,x,y,r);
  }
  // winding road
  c.strokeStyle='#b89a63';c.lineWidth=95;c.lineCap='round';
  c.beginPath();c.moveTo(-100,1020);c.bezierCurveTo(450,830,720,1060,1050,900);c.bezierCurveTo(1420,720,1700,900,1980,690);c.bezierCurveTo(2240,510,2480,650,2750,500);c.stroke();
  c.strokeStyle='#d6bd7b';c.lineWidth=72;c.beginPath();c.moveTo(-100,1020);c.bezierCurveTo(450,830,720,1060,1050,900);c.bezierCurveTo(1420,720,1700,900,1980,690);c.bezierCurveTo(2240,510,2480,650,2750,500);c.stroke();

  // stream
  c.strokeStyle='#1d6071';c.lineWidth=150;c.beginPath();c.moveTo(0,1450);c.bezierCurveTo(500,1280,530,1500,900,1420);c.bezierCurveTo(1300,1320,1400,1500,1900,1450);c.bezierCurveTo(2250,1400,2450,1510,2700,1440);c.stroke();
  c.strokeStyle='#42a7b2';c.lineWidth=112;c.beginPath();c.moveTo(0,1450);c.bezierCurveTo(500,1280,530,1500,900,1420);c.bezierCurveTo(1300,1320,1400,1500,1900,1450);c.bezierCurveTo(2250,1400,2450,1510,2700,1440);c.stroke();

  // flowers and grass
  for(let i=0;i<180;i++){
    let x=(i*97+53)%WORLD.w,y=(i*149+81)%WORLD.h;
    if(y>1320)continue;
    c.strokeStyle='#2b5f31';c.lineWidth=2;c.beginPath();c.moveTo(x,y+8);c.lineTo(x-2,y);c.stroke();
    c.fillStyle=['#f5e3a0','#e58d87','#8db6e8','#f4c56d'][i%4];circle(c,x,y,3);
  }

  // trees
  for(let i=0;i<34;i++){
    let x=(i*263+120)%WORLD.w,y=(i*197+150)%1200;
    drawTree(c,x,y,1+(i%3)*.12);
  }

  // rocks
  for(let i=0;i<35;i++){
    let x=(i*179+90)%WORLD.w,y=(i*311+240)%1250;
    drawRock(c,x,y,1+(i%3)*.15);
  }

  drawHouse(c,1050,620);
  c.restore();
}

function drawTree(c,x,y,s){
  c.save();c.translate(x,y);c.scale(s,s);
  c.fillStyle='#65432d';roundedRect(c,-10,35,20,55,6);
  c.fillStyle='#235a32';circle(c,-28,30,35);circle(c,15,27,38);circle(c,0,-2,42);
  c.fillStyle='#3e8242';circle(c,-25,15,24);circle(c,18,4,27);circle(c,0,-25,27);
  c.restore();
}
function drawRock(c,x,y,s){
  c.save();c.translate(x,y);c.scale(s,s);poly(c,[[-25,8],[-16,-15],[7,-23],[28,-4],[18,14],[-8,18]]);c.fillStyle='#777f79';poly(c,[[-25,8],[-16,-15],[7,-23],[0,-2],[-8,18]]);c.restore();
}
function drawHouse(c,x,y){
  c.save();c.translate(x,y);
  c.fillStyle='#704a32';roundedRect(c,-8,10,266,150,12);
  c.fillStyle='#c69a69';roundedRect(c,0,18,250,142,10);
  c.fillStyle='#7d3f3f';poly(c,[[-25,20],[65,-75],[170,-75],[280,20]]);
  c.fillStyle='#a85b48';poly(c,[[5,7],[65,-58],[170,-58],[250,7]]);
  c.fillStyle='#563625';roundedRect(c,95,78,58,82,7);
  c.fillStyle='#f5d68b';roundedRect(c,32,58,42,42,5);roundedRect(c,174,58,42,42,5);
  c.fillStyle='#ffcf62';circle(c,205,45,6);
  c.fillStyle='#ffe9a1';c.font='900 24px system-ui';c.textAlign='center';c.fillText('ALDEA ELFIR',125,-90);
  c.restore();
}

function drawHero(c){
  const cam=camera(),x=sx(player.x,cam),y=sy(player.y,cam);
  c.save();c.translate(x,y);
  c.fillStyle='#0006';c.scale(1,0.45);circle(c,0,48,48);c.restore();
  c.save();c.translate(x,y);
  const moving=player.dx||player.dy, bob=moving?Math.sin(performance.now()/70)*3:0;
  c.translate(0,bob);
  // cape
  c.fillStyle='#9e3846';poly(c,[[-30,-8],[-47,42],[-20,34],[-5,4]]);
  // body armor
  c.fillStyle='#283d4d';roundedRect(c,-24,-20,48,60,12);c.fillStyle='#d3b55d';roundedRect(c,-24,-18,48,9,4);
  // head/hair
  c.fillStyle='#e7ad7e';circle(c,0,-43,26);c.fillStyle='#4b2a20';c.beginPath();c.arc(0,-50,27,Math.PI,Math.PI*2);c.fill();
  c.fillStyle='#fff';circle(c,10,-42,4);c.fillStyle='#1f2528';circle(c,11,-42,2);
  // sword
  const attacking=player.attackCd>.20;
  c.save();c.translate(25,4);c.rotate(attacking?-1.7:-.6);
  c.fillStyle='#d2b55e';roundedRect(c,-5,-5,12,18,3);c.fillStyle='#f8fbff';poly(c,[[3,-3],[73,0],[82,5],[73,10],[3,8]]);
  c.fillStyle='#70432a';roundedRect(c,-3,6,26,5,2);c.restore();
  if(attacking){
    c.strokeStyle='#ffe78a';c.lineWidth=8;c.shadowBlur=20;c.shadowColor='#fff';c.beginPath();c.arc(15,4,65,-1.55,.15);c.stroke();c.shadowBlur=0;
  }
  c.fillStyle='#ffd34d';c.font='900 13px system-ui';c.textAlign='center';c.fillText('Baby Doom',0,-78);
  c.fillStyle='#47d65d';roundedRect(c,-35,-70,70,6,4);c.fillStyle='#e7c94c';c.fillText('Nv.'+player.lvl,0,-82);
  c.restore();
}

function drawPet(c){
  const cam=camera(),x=sx(player.x-62,cam),y=sy(player.y+30,cam);
  c.save();c.translate(x,y);
  c.fillStyle='#0005';c.scale(1,.45);circle(c,0,22,25);c.restore();
  c.save();c.translate(x,y);
  c.fillStyle='#e1e6e8';circle(c,0,0,18);circle(c,16,-9,13);c.fillStyle='#8d979d';poly(c,[[-4,-16],[3,-30],[10,-17]]);c.fillStyle='#222';circle(c,20,-12,2.5);
  c.fillStyle='#75b8ff';c.font='900 10px system-ui';c.textAlign='center';c.fillText('Lobo Jr.',0,-31);c.restore();
}

function drawWolf(c,m){
  const cam=camera(),x=sx(m.x,cam),y=sy(m.y,cam),bob=Math.sin(performance.now()/220+m.phase)*2;
  c.save();c.translate(x,y+bob);
  c.fillStyle='#0006';c.scale(1,.4);circle(c,0,28,38);c.restore();
  c.save();c.translate(x,y+bob);
  if(m.aggro){c.fillStyle='#f03e3e55';c.beginPath();c.arc(0,18,40,0,Math.PI*2);c.fill()}
  c.fillStyle='#687074';roundedRect(c,-36,-8,62,34,18);c.fillStyle='#80878a';circle(c,27,-10,22);
  c.fillStyle='#555d60';poly(c,[[-2,-25],[8,-43],[18,-25]]);poly(c,[[20,-25],[34,-42],[38,-19]]);
  c.fillStyle='#f1d15b';circle(c,34,-13,4);c.fillStyle='#111';circle(c,35,-13,2);
  c.fillStyle='#555d60';roundedRect(c,-25,18,8,20,4);roundedRect(c,7,18,8,20,4);
  c.fillStyle='#fff';c.font='900 11px system-ui';c.textAlign='center';c.fillText('Lobo Salvaje',0,-50);
  c.fillStyle='#222';roundedRect(c,-36,-44,72,6,4);c.fillStyle='#e44e4e';roundedRect(c,-35,-43,70*(m.hp/m.maxHp),4,3);
  c.restore();
}

function drawDrops(c){
  const cam=camera();
  for(const d of drops){
    const x=sx(d.x,cam),y=sy(d.y,cam)+Math.sin(performance.now()/350+d.phase)*4;
    const col={common:'#54a9ff',rare:'#55df72',epic:'#bd6eea',legend:'#ffad37'}[d.type];
    c.save();c.shadowBlur=18;c.shadowColor=col;c.fillStyle=col;circle(c,x,y,9);c.shadowBlur=0;c.fillStyle='#fff';circle(c,x-2,y-3,3);c.restore();
  }
}

function nearest(range){let best=null,bd=range;for(const m of mobs)if(!m.dead){let d=Math.hypot(m.x-player.x,m.y-player.y);if(d<bd){bd=d;best=m}}return best}

function text(x,y,t,color='#fff'){texts.push({x,y,t,color,life:.65})}
function burst(x,y,color='#fff'){for(let i=0;i<12;i++)particles.push({x,y,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,life:.35,color})}

function attack(){
  if(player.attackCd>0)return;
  player.attackCd=.48;
  const m=nearest(215);
  if(!m){toast('⚔️ Acércate a un lobo');return}
  const dmg=player.attack+Math.floor(Math.random()*12);
  m.hp=Math.max(0,m.hp-dmg);m.aggro=true;
  text(m.x,m.y-65,'-'+dmg,dmg>42?'#ffe45c':'#fff');burst(m.x,m.y,'#fff');shake=5;
  if(m.hp<=0)kill(m);
  update();
}
function kill(m){
  m.dead=true;kills++;player.gold+=15;gainXP(25);drops.push({x:m.x,y:m.y,type:['common','rare','epic','legend'][Math.floor(Math.random()*4)],phase:Math.random()*6});
  setTimeout(()=>{m.x=clamp(m.x+(Math.random()*240-120),120,WORLD.w-120);m.y=clamp(m.y+(Math.random()*240-120),120,WORLD.h-120);m.hp=100;m.dead=false;m.aggro=false},4500);
}
function gainXP(n){player.xp+=n;while(player.xp>=100){player.xp-=100;player.lvl++;player.maxHp+=20;player.hp=player.maxHp;player.maxMp+=10;player.mp=player.maxMp;player.attack+=6;player.defense+=2;toast('⭐ ¡SUBISTE A NIVEL '+player.lvl+'!')}}
function skill(cost,dmg,kind){
  if(player.mp<cost){toast('🔵 No tienes maná');return}
  player.mp-=cost;const m=nearest(300);
  if(!m){toast(kind+' No hay enemigos cerca');update();return}
  m.hp=Math.max(0,m.hp-dmg);m.aggro=true;text(m.x,m.y-65,kind+' -'+dmg,'#ffe67c');burst(m.x,m.y,kind==='🔥'?'#ff8d32':'#80c8ff');if(m.hp<=0)kill(m);update()
}
document.getElementById('attack').onclick=attack;
document.getElementById('fire').onclick=()=>skill(15,55,'🔥');
document.getElementById('ice').onclick=()=>skill(20,45,'❄️');
document.getElementById('magic').onclick=()=>skill(30,70,'✨');
document.getElementById('potion').onclick=()=>{if(player.hp>=player.maxHp)toast('❤️ Vida completa');else{player.hp=Math.min(player.maxHp,player.hp+40);toast('🧪 +40 vida');update()}};
document.getElementById('auto').onclick=()=>{player.auto=!player.auto;document.getElementById('auto').style.borderColor=player.auto?'#55e875':'#d2b95e';toast(player.auto?'🤖 AUTO activado':'🤖 AUTO desactivado')};

function toast(s){const e=document.getElementById('toast');e.textContent=s;e.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.style.display='none',900)}
function update(){
  for(const [id,v] of [['lvl',player.lvl],['atk',player.attack],['def',player.defense],['gold',player.gold],['kills',Math.min(8,kills)+'/8'],['qkills',Math.min(8,kills)+'/8']])document.getElementById(id).textContent=v;
  document.getElementById('hp').style.width=player.hp/player.maxHp*100+'%';document.getElementById('mp').style.width=player.mp/player.maxMp*100+'%';document.getElementById('xp').style.width=player.xp+'%';
}
function updateTarget(){
  const m=nearest(300),box=document.getElementById('target');
  if(!m){box.style.opacity=0;return} box.style.opacity=1;document.getElementById('targetHp').style.width=m.hp+'%';
}
function collect(){
  for(let i=drops.length-1;i>=0;i--){const d=drops[i];if(Math.hypot(d.x-player.x,d.y-player.y)<62){player.gold+=10;drops.splice(i,1);toast('💰 +10 oro');update()}}
}

let joy=document.getElementById('joy'),knob=document.getElementById('knob'),active=false;
function setJoy(e){const r=joy.getBoundingClientRect();let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,l=Math.hypot(x,y),max=34;if(l>max){x=x/l*max;y=y/l*max}player.dx=x/max;player.dy=y/max;knob.style.transform=`translate(${x}px,${y}px)`}
joy.addEventListener('pointerdown',e=>{active=true;joy.setPointerCapture(e.pointerId);setJoy(e)});
joy.addEventListener('pointermove',e=>{if(active)setJoy(e)});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>joy.addEventListener(ev,()=>{active=false;player.dx=player.dy=0;knob.style.transform='translate(0,0)'}));

function loop(t){
  const dt=Math.min(.04,(t-last)/1000);last=t;
  if(player.attackCd>0)player.attackCd-=dt;
  let kx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),ky=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  if(!active&&(kx||ky)){let l=Math.hypot(kx,ky);player.dx=kx/l;player.dy=ky/l}else if(!active&&!kx&&!ky&&player.auto===false){player.dx=player.dy=0}
  if(player.auto&&!active){let m=nearest(260);if(m){let dx=m.x-player.x,dy=m.y-player.y,l=Math.hypot(dx,dy);if(l>150){player.dx=dx/l;player.dy=dy/l}else{player.dx=player.dy=0;if(player.attackCd<=0)attack()}}}
  if(player.dx||player.dy){let l=Math.hypot(player.dx,player.dy);player.x=clamp(player.x+player.dx/l*player.speed*dt,50,WORLD.w-50);player.y=clamp(player.y+player.dy/l*player.speed*dt,50,WORLD.h-50)}
  for(const m of mobs)if(!m.dead){let dx=player.x-m.x,dy=player.y-m.y,d=Math.hypot(dx,dy);if(d<310){m.aggro=true;if(d>65){m.x+=dx/d*36*dt;m.y+=dy/d*36*dt}else{m.attackTimer-=dt;if(m.attackTimer<=0){m.attackTimer=1.2;let dmg=Math.max(2,Math.floor(8+Math.random()*8-player.defense));player.hp=Math.max(0,player.hp-dmg);text(player.x,player.y-55,'-'+dmg,'#ff6666');if(player.hp<=0){player.hp=player.maxHp;player.x=920;player.y=870;toast('💀 Has caído... vuelves a la aldea')}}}}}
  collect();updateTarget();render(t);update();requestAnimationFrame(loop)
}
function render(t){
  drawGround(ctx);for(const d of drops){} drawDrops(ctx);for(const m of mobs)if(!m.dead)drawWolf(ctx,m);drawPet(ctx);drawHero(ctx);
  fctx.clearRect(0,0,innerWidth,innerHeight);
  const cam=camera();
  for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*.016;p.y+=p.vy*.016;p.life-=.016;if(p.life<=0){particles.splice(i,1);continue}fctx.globalAlpha=p.life/.35;fctx.fillStyle=p.color;circle(fctx,sx(p.x,cam),sy(p.y,cam),3+4*p.life/.35)}
  fctx.globalAlpha=1;
  for(let i=texts.length-1;i>=0;i--){let q=texts[i];q.y-=.8;q.life-=.016;if(q.life<=0){texts.splice(i,1);continue}fctx.globalAlpha=q.life/.65;fctx.fillStyle=q.color;fctx.font='900 20px system-ui';fctx.textAlign='center';fctx.strokeStyle='#000';fctx.lineWidth=4;fctx.strokeText(q.t,sx(q.x,cam),sy(q.y,cam));fctx.fillText(q.t,sx(q.x,cam),sy(q.y,cam))}
  fctx.globalAlpha=1;
  drawMini()
}
function drawMini(){
  const w=128,h=94;mctx.clearRect(0,0,w,h);mctx.fillStyle='#315f36';mctx.fillRect(0,0,w,h);mctx.strokeStyle='#b9d18d';mctx.lineWidth=5;mctx.beginPath();mctx.moveTo(0,55);mctx.lineTo(40,48);mctx.lineTo(75,56);mctx.lineTo(128,38);mctx.stroke();mctx.fillStyle='#d7a45d';mctx.fillRect(53,32,13,10);
  for(const m of mobs)if(!m.dead){mctx.fillStyle='#e34e4e';mctx.fillRect(m.x/WORLD.w*w-2,m.y/WORLD.h*h-2,4,4)}
  mctx.fillStyle='#ffe04d';mctx.beginPath();mctx.arc(player.x/WORLD.w*w,player.y/WORLD.h*h,5,0,Math.PI*2);mctx.fill()
}
update();requestAnimationFrame(loop);
setInterval(()=>{if(player.mp<player.maxMp){player.mp=Math.min(player.maxMp,player.mp+3);update()}},1000);
</script>
