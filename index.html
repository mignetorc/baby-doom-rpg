<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Baby Doom RPG — Mundo 1</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#10251a;
  font-family:system-ui,-apple-system,sans-serif;
  touch-action:none
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#2d6639
}

#map{
  position:absolute;
  width:2600px;
  height:1800px;
  left:0;
  top:0;
  background:#376f3d
}

#map:before{
  content:"";
  position:absolute;
  inset:0;
  background:
  radial-gradient(circle at 15% 20%,#4d8a45 0 5px,transparent 6px),
  radial-gradient(circle at 60% 70%,#2a5a34 0 5px,transparent 6px);
  background-size:110px 90px;
  opacity:.5
}

.ground{
  position:absolute;
  left:-200px;
  top:880px;
  width:3000px;
  height:210px;
  background:#c9b17e;
  transform:rotate(-7deg);
  border-top:8px solid #dfcc9a;
  border-bottom:8px solid #a38b60;
  box-shadow:0 10px 20px #0002
}

.tree{
  position:absolute;
  width:90px;
  height:115px
}

.tree .trunk{
  position:absolute;
  bottom:0;
  left:38px;
  width:18px;
  height:55px;
  background:#69472d;
  border-radius:6px
}

.tree .leaf{
  position:absolute;
  width:75px;
  height:75px;
  border-radius:50%;
  background:#2c713a;
  border:5px solid #205a30;
  left:7px;
  top:0;
  box-shadow:22px 22px 0 #3b8244,-18px 27px 0 #34783e
}

.rock{
  position:absolute;
  width:55px;
  height:35px;
  border-radius:55% 45% 45% 55%;
  background:#77827d;
  border:4px solid #5d6864;
  box-shadow:10px -5px 0 #909a94 inset
}

.house{
  position:absolute;
  width:250px;
  height:145px;
  background:#c79b6c;
  border:7px solid #744d35;
  border-radius:12px;
  box-shadow:0 12px 20px #0003
}

.house:before{
  content:"";
  position:absolute;
  left:-25px;
  top:-80px;
  border-left:150px solid transparent;
  border-right:150px solid transparent;
  border-bottom:95px solid #7d3e3e
}

.door{
  position:absolute;
  left:95px;
  bottom:0;
  width:55px;
  height:82px;
  background:#513526;
  border-radius:8px 8px 0 0
}

.sign{
  position:absolute;
  top:-125px;
  left:30px;
  right:30px;
  text-align:center;
  color:#ffe49a;
  font-weight:900;
  font-size:28px;
  text-shadow:0 3px 4px #000
}

/* HERO */

#hero,#pet,.mob,.drop{
  position:absolute;
  z-index:20
}

#hero{
  width:100px;
  height:125px;
  transform:translate(-50%,-50%)
}

.heroShadow{
  position:absolute;
  left:12px;
  bottom:3px;
  width:76px;
  height:20px;
  background:#0005;
  border-radius:50%
}

.heroCape{
  position:absolute;
  left:11px;
  top:50px;
  width:35px;
  height:65px;
  background:#a9434e;
  clip-path:polygon(0 0,100% 10%,76% 100%,15% 82%)
}

.heroBody{
  position:absolute;
  left:25px;
  top:47px;
  width:48px;
  height:61px;
  background:#344958;
  border:4px solid #d0b45f;
  border-radius:12px
}

.heroHead{
  position:absolute;
  left:27px;
  top:7px;
  width:46px;
  height:46px;
  border-radius:50%;
  background:#e6a979;
  border:3px solid #985e45
}

.heroHair{
  position:absolute;
  left:26px;
  top:3px;
  width:48px;
  height:23px;
  background:#4b2b20;
  border-radius:50% 50% 35% 35%
}

.heroEye{
  position:absolute;
  left:60px;
  top:25px;
  width:7px;
  height:7px;
  background:#fff;
  border-radius:50%
}

.heroSword{
  position:absolute;
  left:62px;
  top:48px;
  width:66px;
  height:10px;
  background:#f4f7fa;
  border-radius:8px;
  transform:rotate(-34deg);
  box-shadow:0 0 7px #fff
}

#hero.walk .heroBody{
  animation:bob .18s infinite alternate
}

@keyframes bob{
  to{transform:translateY(-5px)}
}

#hero.attack .heroSword{
  animation:swordAttack .22s ease
}

@keyframes swordAttack{
  0%{transform:rotate(-34deg)}
  50%{transform:rotate(-75deg) scale(1.15)}
  100%{transform:rotate(-34deg)}
}

/* PET */

#pet{
  width:52px;
  height:36px;
  transform:translate(-50%,-50%);
  z-index:19
}

.petBody{
  width:44px;
  height:29px;
  border-radius:55%;
  background:#e0e5e7;
  border:3px solid #929da2
}

.petHead{
  position:absolute;
  right:-5px;
  top:1px;
  width:25px;
  height:25px;
  border-radius:50%;
  background:#c7d0d4;
  border:2px solid #929da2
}

.petEye{
  position:absolute;
  right:5px;
  top:8px;
  width:4px;
  height:4px;
  background:#222;
  border-radius:50%
}

/* MONSTRUOS */

.mob{
  width:100px;
  height:95px;
  transform:translate(-50%,-50%);
  text-align:center;
  transition:opacity .2s
}

.mobName{
  font-size:12px;
  font-weight:800;
  color:#fff;
  text-shadow:0 2px 4px #000;
  margin-bottom:3px
}

.mobHp{
  height:7px;
  width:70px;
  margin:auto;
  background:#222;
  border-radius:6px;
  overflow:hidden
}

.mobHp i{
  display:block;
  height:100%;
  background:#e55353;
  transition:width .15s
}

.wolf{
  position:relative;
  width:78px;
  height:55px;
  margin:auto
}

.wolfBody{
  position:absolute;
  left:5px;
  top:15px;
  width:60px;
  height:38px;
  background:#858d8e;
  border:3px solid #626a6b;
  border-radius:55% 45% 45% 50%
}

.wolfHead{
  position:absolute;
  right:1px;
  top:4px;
  width:32px;
  height:32px;
  background:#92999a;
  border:3px solid #626a6b;
  border-radius:50%
}

.wolfEar{
  position:absolute;
  right:2px;
  top:-7px;
  width:13px;
  height:16px;
  background:#626a6b;
  clip-path:polygon(0 100%,45% 0,100% 100%)
}

.wolfEye{
  position:absolute;
  right:11px;
  top:14px;
  width:5px;
  height:5px;
  background:#ffdf55;
  border-radius:50%
}

.mob.hit .wolfBody{
  filter:brightness(2);
  transform:translateX(7px)
}

.mob.dead{
  opacity:0;
  pointer-events:none
}

/* DROPS */

.drop{
  width:24px;
  height:24px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 16px currentColor;
  border:4px solid currentColor;
  z-index:15
}

.common{color:#55aaff}
.rare{color:#4ddd68}
.epic{color:#b96eea}
.legend{color:#ff972f}

.drop:after{
  content:"";
  position:absolute;
  inset:5px;
  background:currentColor;
  border-radius:50%
}

/* HUD */

.hud{
  position:fixed;
  z-index:50;
  top:max(8px,env(safe-area-inset-top));
  left:8px;
  right:8px;
  display:flex;
  justify-content:space-between;
  gap:8px;
  pointer-events:none
}

.panel{
  background:#10191de8;
  border:2px solid #66767a;
  border-radius:14px;
  color:#fff;
  padding:7px 9px;
  box-shadow:0 5px 16px #0005;
  font-size:10px
}

.panel b{
  font-size:12px
}

.bar{
  height:7px;
  width:150px;
  background:#273038;
  border-radius:8px;
  overflow:hidden;
  margin:2px 0
}

.bar i{
  display:block;
  height:100%;
  transition:width .2s
}

.red{background:#e45757}
.blue{background:#4c83e4}
.gold{background:#e6ca4a}

/* DAMAGE */

.damage{
  position:absolute;
  z-index:100;
  color:#fff;
  font-size:18px;
  font-weight:900;
  text-shadow:0 2px 4px #000;
  pointer-events:none;
  animation:damageFloat .7s forwards
}

.damage.player{
  color:#ff6464
}

@keyframes damageFloat{
  0%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1)
  }
  100%{
    opacity:0;
    transform:translate(-50%,-110px) scale(1.3)
  }
}

/* CONTROLES */

#controls{
  position:fixed;
  z-index:60;
  left:10px;
  right:10px;
  bottom:max(8px,env(safe-area-inset-bottom));
  display:flex;
  justify-content:space-between;
  align-items:end
}

#joy{
  width:92px;
  height:92px;
  border:2px solid #fff8;
  border-radius:50%;
  background:#101820b8;
  position:relative;
  touch-action:none
}

#knob{
  position:absolute;
  left:25px;
  top:25px;
  width:42px;
  height:42px;
  border-radius:50%;
  background:#fff9
}

.actions{
  display:flex;
  gap:5px
}

.btn{
  width:50px;
  height:50px;
  border-radius:50%;
  border:2px solid #fff8;
  background:#30489f;
  color:#fff;
  font-size:21px
}

.attack{
  background:#a74339
}

.btn:active{
  transform:scale(.9)
}

/* INVENTARIO */

#inventory{
  position:fixed;
  z-index:55;
  left:50%;
  transform:translateX(-50%);
  bottom:max(5px,env(safe-area-inset-bottom));
  display:flex;
  gap:3px;
  background:#111a20e8;
  padding:4px;
  border:1px solid #fff7;
  border-radius:10px
}

.slot{
  width:34px;
  height:34px;
  border:1px solid #aaa;
  background:#26333c;
  border-radius:5px;
  display:grid;
  place-items:center;
  font-size:17px
}

/* MENSAJES */

#msg{
  position:fixed;
  z-index:80;
  left:50%;
  top:48%;
  transform:translate(-50%,-50%);
  background:#101a;
  color:#fff;
  border:2px solid #fff7;
  border-radius:12px;
  padding:10px 15px;
  font-weight:800;
  display:none;
  text-align:center;
  white-space:nowrap
}
</style>
</head>

<body>

<div id="game">

<div id="map">

<div class="ground"></div>

<div class="house" style="left:1050px;top:620px">
<div class="door"></div>
<div class="sign">🌲 ALDEA ELFIR</div>
</div>

<div class="tree" style="left:120px;top:180px"><div class="trunk"></div><div class="leaf"></div></div>
<div class="tree" style="left:420px;top:340px"><div class="trunk"></div><div class="leaf"></div></div>
<div class="tree" style="left:760px;top:170px"><div class="trunk"></div><div class="leaf"></div></div>
<div class="tree" style="left:1380px;top:280px"><div class="trunk"></div><div class="leaf"></div></div>
<div class="tree" style="left:1810px;top:170px"><div class="trunk"></div><div class="leaf"></div></div>
<div class="tree" style="left:2200px;top:460px"><div class="trunk"></div><div class="leaf"></div></div>
<div class="tree" style="left:360px;top:1160px"><div class="trunk"></div><div class="leaf"></div></div>
<div class="tree" style="left:1500px;top:1250px"><div class="trunk"></div><div class="leaf"></div></div>
<div class="tree" style="left:2050px;top:1120px"><div class="trunk"></div><div class="leaf"></div></div>

<div class="rock" style="left:530px;top:760px"></div>
<div class="rock" style="left:890px;top:420px"></div>
<div class="rock" style="left:1640px;top:760px"></div>

<div id="mobs"></div>
<div id="drops"></div>

</div>

<div id="hero">
<div class="heroShadow"></div>
<div class="heroCape"></div>
<div class="heroBody"></div>
<div class="heroHead"></div>
<div class="heroHair"></div>
<div class="heroEye"></div>
<div class="heroSword"></div>
</div>

<div id="pet">
<div class="petBody"></div>
<div class="petHead"></div>
<div class="petEye"></div>
</div>

</div>

<!-- HUD -->

<div class="hud">

<div class="panel">

<b>👶 BabyDoom · Guerrero · Nv. <span id="lvl">1</span></b>

<br>

❤️
<div class="bar">
<i class="red" id="hp" style="width:100%"></i>
</div>

🔵
<div class="bar">
<i class="blue" id="mp" style="width:100%"></i>
</div>

⭐
<div class="bar">
<i class="gold" id="xp" style="width:8%"></i>
</div>

</div>

<div class="panel">

📜 <b>Misión</b>

<br>
Lobos <span id="kills">0</span>/8

<br>
💰 <span id="gold">0</span>

<br>
🌲 Mundo 1

</div>

</div>

<!-- CONTROLES -->

<div id="controls">

<div id="joy">
<div id="knob"></div>
</div>

<div class="actions">

<button class="btn" id="fire">🔥</button>
<button class="btn" id="ice">❄️</button>
<button class="btn" id="magic">✨</button>
<button class="btn attack" id="attack">⚔️</button>

</div>

</div>

<!-- INVENTARIO -->

<div id="inventory">

<div class="slot">🗡️</div>
<div class="slot">🛡️</div>
<div class="slot" id="potion">💊</div>
<div class="slot">💎</div>
<div class="slot">🔒</div>
<div class="slot">🔒</div>
<div class="slot">🔒</div>

</div>

<div id="msg"></div>

<script>

const WORLD={
w:2600,
h:1800
};

const player={
x:920,
y:870,

dx:0,
dy:0,

speed:240,

maxHp:100,
hp:100,

maxMp:100,
mp:100,

xp:8,
lvl:1,

gold:0,

attack:35,
defense:5,

attackCooldown:false,
skillCooldown:false
};

const hero=document.getElementById('hero');
const pet=document.getElementById('pet');
const map=document.getElementById('map');

const mobs=[];
const drops=[];

/* CREAR LOBO */

function addMob(x,y){

let e=document.createElement('div');

e.className='mob';

e.innerHTML=`

<div class="mobName">Lobo · Nv. 3</div>

<div class="mobHp">
<i></i>
</div>

<div class="wolf">

<div class="wolfBody"></div>
<div class="wolfHead"></div>
<div class="wolfEar"></div>
<div class="wolfEye"></div>

</div>
`;

document.getElementById('mobs').appendChild(e);

mobs.push({

x,
y,

hp:100,
maxHp:100,

el:e,

dead:false,

aggro:false,

attackTimer:0

});

}

/* LOBOS */

[
[620,670],
[700,760],
[790,650],
[880,730],
[1010,680],
[1110,760],
[1220,690],
[1320,820],
[760,930],
[980,970],
[1160,940],
[1380,980]

].forEach(p=>addMob(...p));

/* DROPS INICIALES */

[
[580,600,'common'],
[680,850,'rare'],
[850,600,'common'],
[1120,620,'epic'],
[1320,900,'legend']

].forEach(p=>{

let d=document.createElement('div');

d.className='drop '+p[2];

d.style.left=p[0]+'px';
d.style.top=p[1]+'px';

document.getElementById('drops').appendChild(d);

drops.push({
x:p[0],
y:p[1],
el:d
});

});

/* CLAMP */

function clamp(v,a,b){
return Math.max(a,Math.min(b,v))
}

/* RENDER */

function render(){

const camX=clamp(
player.x-innerWidth/2,
0,
WORLD.w-innerWidth
);

const camY=clamp(
player.y-innerHeight/2,
0,
WORLD.h-innerHeight
);

map.style.transform=
`translate(${-camX}px,${-camY}px)`;

hero.style.left=
(player.x-camX)+'px';

hero.style.top=
(player.y-camY)+'px';

pet.style.left=
(player.x-58-camX)+'px';

pet.style.top=
(player.y+28-camY)+'px';

hero.classList.toggle(
'walk',
!!(player.dx||player.dy)
);

mobs.forEach(m=>{

if(m.dead)return;

m.el.style.left=
(m.x-camX)+'px';

m.el.style.top=
(m.y-camY)+'px';

m.el.querySelector('i').style.width=
m.hp+'%';

});

}

/* GAME LOOP */

let last=performance.now();

function loop(t){

let dt=Math.min(.04,(t-last)/1000);

last=t;

/* MOVIMIENTO */

if(player.dx||player.dy){

let l=Math.hypot(
player.dx,
player.dy
);

player.x=clamp(
player.x+
player.dx/l*
player.speed*
dt,
50,
WORLD.w-50
);

player.y=clamp(
player.y+
player.dy/l*
player.speed*
dt,
50,
WORLD.h-50
);

}

/* LOBOS */

mobs.forEach(m=>{

if(m.dead)return;

let dx=player.x-m.x;
let dy=player.y-m.y;

let d=Math.hypot(dx,dy);

/* PERSEGUIR */

if(d<310){

m.aggro=true;

if(d>65){

m.x+=dx/d*35*dt;
m.y+=dy/d*35*dt;

}

}

/* ATAQUE DEL LOBO */

if(m.aggro && d<75){

m.attackTimer-=dt;

if(m.attackTimer<=0){

m.attackTimer=1.2;

wolfAttack(m);

}

}

});

collectDrops();

render();

requestAnimationFrame(loop);

}

requestAnimationFrame(loop);

/* ATAQUE DEL LOBO */

function wolfAttack(m){

let damage=
Math.max(
2,
Math.floor(8+
Math.random()*8-
player.defense
)
);

player.hp=
Math.max(
0,
player.hp-damage
);

damageText(
player.x,
player.y-60,
'-'+damage,
true
);

update();

if(player.hp<=0){

player.hp=player.maxHp;

player.x=920;
player.y=870;

show('💀 Has caído... vuelves a la aldea');

update();

}

}

/* JOYSTICK */

const joy=document.getElementById('joy');
const knob=document.getElementById('knob');

let active=false;

function setJoy(e){

let r=joy.getBoundingClientRect();

let x=e.clientX-r.left-r.width/2;
let y=e.clientY-r.top-r.height/2;

let max=32;

let l=Math.hypot(x,y);

if(l>max){

x=x/l*max;
y=y/l*max;

}

player.dx=x/max;
player.dy=y/max;

knob.style.transform=
`translate(${x}px,${y}px)`;

}

joy.addEventListener(
'pointerdown',
e=>{

active=true;

joy.setPointerCapture(
e.pointerId
);

setJoy(e);

});

joy.addEventListener(
'pointermove',
e=>{

if(active)setJoy(e);

});

[
'pointerup',
'pointercancel',
'lostpointercapture'

].forEach(x=>

joy.addEventListener(
x,
()=>{

active=false;

player.dx=0;
player.dy=0;

knob.style.transform=
'translate(0,0)';

})

);

/* ATAQUE */

document.getElementById(
'attack'
).onclick=()=>{

attack();

};

/* ATAQUE PRINCIPAL */

function attack(){

if(player.attackCooldown)return;

player.attackCooldown=true;

hero.classList.add('attack');

setTimeout(()=>{

hero.classList.remove('attack');

},250);

setTimeout(()=>{

player.attackCooldown=false;

},450);

let targets=mobs
.filter(m=>
!m.dead &&
Math.hypot(
m.x-player.x,
m.y-player.y
)<210
)
.sort((a,b)=>
Math.hypot(
a.x-player.x,
a.y-player.y
)-
Math.hypot(
b.x-player.x,
b.y-player.y
)
);

if(!targets.length){

show('⚔️ Acércate a un lobo');

return;

}

let m=targets[0];

let damage=
player.attack+
Math.floor(Math.random()*12);

let critical=
Math.random()<0.12;

if(critical){

damage*=2;

damageText(
m.x,
m.y-70,
'💥 CRÍTICO '+damage
);

}else{

damageText(
m.x,
m.y-70,
'-'+damage
);

}

m.hp=Math.max(
0,
m.hp-damage
);

m.el.classList.add('hit');

setTimeout(()=>{
m.el.classList.remove('hit');
},180);

if(m.hp<=0){

killMob(m);

}

update();

}

/* MATAR LOBO */

function killMob(m){

m.dead=true;

m.el.classList.add('dead');

player.gold+=15;

gainXP(25);

dropNear(
m.x,
m.y
);

setTimeout(()=>{

respawnMob(m);

},5000);

}

/* RESPawn */

function respawnMob(m){

m.x=clamp(
m.x+(Math.random()*200-100),
100,
WORLD.w-100
);

m.y=clamp(
m.y+(Math.random()*200-100),
100,
WORLD.h-100
);

m.hp=100;

m.dead=false;

m.aggro=false;

m.el.classList.remove('dead');

}

/* EXPERIENCIA */

function gainXP(amount){

player.xp+=amount;

while(player.xp>=100){

player.xp-=100;

player.lvl++;

player.maxHp+=20;
player.hp=player.maxHp;

player.maxMp+=10;
player.mp=player.maxMp;

player.attack+=6;

player.defense+=2;

show(
'⭐ ¡SUBISTE A NIVEL '+
player.lvl+'!'
);

}

}

/* DROP */

function dropNear(x,y){

let types=[
'common',
'rare',
'epic',
'legend'
];

let type=
types[
Math.floor(
Math.random()*types.length
)
];

let d=document.createElement('div');

d.className=
'drop '+type;

d.style.left=x+'px';
d.style.top=y+'px';

document
.getElementById('drops')
.appendChild(d);

drops.push({

x,
y,
el:d

});

}

/* RECOGER */

function collectDrops(){

for(let i=drops.length-1;i>=0;i--){

let d=drops[i];

if(!d.el.parentNode){

drops.splice(i,1);

continue;

}

let distance=
Math.hypot(
d.x-player.x,
d.y-player.y
);

if(distance<55){

player.gold+=10;

d.el.remove();

drops.splice(i,1);

show('💰 +10 oro');

update();

}

}

}

/* DAÑO FLOTANTE */

function damageText(
x,
y,
text,
playerDamage=false
){

const camX=clamp(
player.x-innerWidth/2,
0,
WORLD.w-innerWidth
);

const camY=clamp(
player.y-innerHeight/2,
0,
WORLD.h-innerHeight
);

let d=
document.createElement('div');

d.className=
'damage'+
(playerDamage?' player':'');

d.textContent=text;

d.style.left=
(x-camX)+'px';

d.style.top=
(y-camY)+'px';

document
.getElementById('game')
.appendChild(d);

setTimeout(()=>{
d.remove();
},700);

}

/* HABILIDADES */

document.getElementById(
'fire'
).onclick=()=>{

if(player.mp<15){

show('🔵 No tienes maná');

return;

}

player.mp-=15;

let target=nearestMob(250);

if(target){

target.hp=Math.max(
0,
target.hp-55
);

damageText(
target.x,
target.y-70,
'🔥 -55'
);

if(target.hp<=0){

killMob(target);

}

}else{

show('🔥 No hay enemigos cerca');

}

update();

};

/* HIELO */

document.getElementById(
'ice'
).onclick=()=>{

if(player.mp<20){

show('🔵 No tienes maná');

return;

}

player.mp-=20;

let target=nearestMob(280);

if(target){

target.hp=Math.max(
0,
target.hp-45
);

damageText(
target.x,
target.y-70,
'❄️ -45'
);

if(target.hp<=0){

killMob(target);

}else{

target.aggro=false;

}

}else{

show('❄️ No hay enemigos cerca');

}

update();

};

/* MAGIA */

document.getElementById(
'magic'
).onclick=()=>{

if(player.mp<30){

show('🔵 No tienes maná');

return;

}

player.mp-=30;

let target=nearestMob(300);

if(target){

let damage=70;

target.hp=Math.max(
0,
target.hp-damage
);

damageText(
target.x,
target.y-70,
'✨ -70'
);

if(target.hp<=0){

killMob(target);

}

}else{

show('✨ No hay enemigos cerca');

}

update();

};

/* ENEMIGO MÁS CERCANO */

function nearestMob(range){

let targets=
mobs.filter(m=>
!m.dead &&
Math.hypot(
m.x-player.x,
m.y-player.y
)<range
);

if(!targets.length)return null;

targets.sort((a,b)=>
Math.hypot(
a.x-player.x,
a.y-player.y
)-
Math.hypot(
b.x-player.x,
b.y-player.y
)
);

return targets[0];

}

/* POCIÓN */

document.getElementById(
'potion'
).onclick=()=>{

if(player.hp>=player.maxHp){

show('❤️ Ya tienes la vida completa');

return;

}

player.hp=Math.min(
player.maxHp,
player.hp+40
);

show('🧪 +40 vida');

update();

};

/* MENSAJES */

function show(s){

let m=
document.getElementById('msg');

m.textContent=s;

m.style.display='block';

clearTimeout(window.tm);

window.tm=setTimeout(
()=>{
m.style.display='none'
},
1000
);

}

/* HUD */

function update(){

document.getElementById(
'lvl'
).textContent=
player.lvl;

document.getElementById(
'gold'
).textContent=
player.gold;

document.getElementById(
'kills'
).textContent=
mobs.filter(m=>m.dead).length;

document.getElementById(
'xp'
).style.width=
player.xp+'%';

document.getElementById(
'hp'
).style.width=
(player.hp/player.maxHp*100)+'%';

document.getElementById(
'mp'
).style.width=
(player.mp/player.maxMp*100)+'%';

}

/* REGENERACIÓN DE MANÁ */

setInterval(()=>{

if(player.mp<player.maxMp){

player.mp=Math.min(
player.maxMp,
player.mp+3
);

update();

}

},1000);

/* INICIALIZAR */

update();

</script>
